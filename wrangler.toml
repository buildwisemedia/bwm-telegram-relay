name = "bwm-telegram-relay"
main = "src/index.ts"
compatibility_date = "2025-04-25"
account_id = "ba00448499190431e6e4a00820f2200d"
workers_dev = true

[triggers]
# Heartbeat every 15 min — watchdog threshold is 2× interval = 30 min staleness max.
# 20:30 UTC = 16:30 EDT One Wire Day Done digest (15:30 EST in winter — acceptable drift).
# 13:00 UTC = 09:00 EDT One Wire Day Ahead digest (08:00 EST in winter — still in-hours;
# quiet hours end 08:00 ET, so redelivered decisions never land in the quiet window).
crons = ["*/15 * * * *", "30 20 * * *", "0 13 * * *"]

[[kv_namespaces]]
binding = "BWM_TELEGRAM_KV"
id = "ab6c7f536e92480d877341b28e551d15"

[[services]]
binding = "CRED_BROKER"
service = "bwm-cred-broker"

# Forward inbound Robert messages to bwm-attention-router for classification
# (PROJ-ATTN-ROUTING-001 Phase 6). Non-blocking via ctx.waitUntil.
[[services]]
binding = "ATTENTION_ROUTER"
service = "bwm-attention-router"

# Forward inbound Robert messages to bwm-content-classifier for content
# tagging (brand/strategy/lock/decision/idea/todo). Sibling of attention-router;
# tagged content routes to Brain inbox/telegram-YYYY-MM-DD.md automatically.
# PROJ-TELEGRAM-MIGRATION-001 Phase 0 / Chip 7b. Non-blocking via ctx.waitUntil.
[[services]]
binding = "CONTENT_CLASSIFIER"
service = "bwm-content-classifier"

[vars]
ENVIRONMENT = "production"

[observability]
enabled = true

# Secrets (set via `wrangler secret put`):
#   BROKER_BEARER                — bearer token for bwm-cred-broker auth
#   BWM_INTERNAL_KEY             — X-BWM-Internal-Key for /send legacy route
#   ATTENTION_ROUTER_KEY         — X-BWM-Internal-Key for bwm-attention-router /classify
#   TELEGRAM_WEBHOOK_SECRET      — X-Telegram-Bot-Api-Secret-Token from Telegram
#   TELEGRAM_RELAY_ADMIN_HMAC    — pre-image secret for /test admin HMAC
#   SUPABASE_URL                 — https://lscifhwmmkjiobnthlak.supabase.co
#   SUPABASE_SERVICE_KEY         — sb_secret_* for operational_events heartbeat writes
#   BRAIN_KEY                    — x-brain-key read token for brain.buildwisemedia.com
#                                  (enables directive handler to read Attention-Routing-Spec.md)
#   BRAIN_WRITE_KEY              — x-write-key token for brain.buildwisemedia.com /write
#                                  (enables directive handler to append silent_handle overrides)
#
# TELEGRAM_BOT_TOKEN is minted via CRED_BROKER at runtime — not stored as a direct secret here.

# ─────────────────────────────────────────────────────────────────────────────
# [env.capture] — the acceptance-drill worker (One Wire remediation plan v6 §2.10)
#
# A SEPARATE worker (bwm-telegram-relay-capture) with its OWN KV namespace, so a drill
# can exercise production-shaped code paths — the real dispatch, the real composers,
# the real registries — without touching one production row, one production KV key, or
# Robert's phone.
#
#   · CAPTURE_MODE=true diverts EVERY operational-event emission to KV capture:events:*
#     and stamps metadata.capture=true on outbound rows, so capture rows are excluded
#     from every denominator.
#   · Telegram I/O is short-circuited in-code (see CAPTURE_BOT_TOKEN): sends and edits
#     are recorded with synthetic message ids and never reach the Telegram API.
#   · No [triggers]: the capture worker has no crons. Drills invoke it explicitly.
#
# test/live/capture-pollution-check.sh is the standing proof, and it fails on ANY
# production hit AND on any query failure — a dead query must never read as clean.
# ─────────────────────────────────────────────────────────────────────────────
[env.capture]
workers_dev = true

# NO CRONS (Sol QA r1, P1-4). A named Cloudflare environment INHERITS the top-level
# [triggers] block unless it declares its own — the capture worker had all three
# production schedules live, and scheduled activity can mutate capture KV and outbound
# evidence in the middle of an acceptance drill. An earlier claim that capture had no
# crons was made from a `wrangler deploy --dry-run` grep, which does not report the
# schedules API state; the live API is the only source of truth here, and
# test/phase/phase2-accept.sh now asserts against it.
[env.capture.triggers]
crons = []

[env.capture.vars]
ENVIRONMENT = "capture"
CAPTURE_MODE = "true"

[[env.capture.kv_namespaces]]
binding = "BWM_TELEGRAM_KV"
id = "3d94fc6c6fcb4da088bc2d0227595211"

[[env.capture.services]]
binding = "CRED_BROKER"
service = "bwm-cred-broker"

[[env.capture.services]]
binding = "ATTENTION_ROUTER"
service = "bwm-attention-router"

[[env.capture.services]]
binding = "CONTENT_CLASSIFIER"
service = "bwm-content-classifier"
